[tool.poetry]
name = "lechefacil-backend"
version = "0.1.0"
description = "Minimal multi-tenant backend MVP for LecheFacil with FastAPI"
authors = ["LecheFacil Team <team@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = {extras = ["standard"], version = "^0.162.0"}
uvicorn = {extras = ["standard"], version = "^0.54.0"}
httpx = "^0.28.1"
SQLAlchemy = {extras = ["asyncio"], version = "^2.1.6"}
asyncpg = "^0.32.0"
alembic = "^1.20.1"
pydantic-settings = "^2.16.1"
botocore = "^1.43.120"
boto3 = "^1.43.120"
reportlab = "^5.1.0"
openai = "^3.40.0"
bcrypt = "^5.0.0"
pyjwt = {extras = ["crypto"], version = "^2.15.1"}
email-validator = "^2.3.0"
python-multipart = "^0.0.32"

[tool.poetry.group.dev.dependencies]
aiosqlite = "^0.22.1"
pytest = "^9.2.0"
pytest-asyncio = "^1.4.1"
pytest-cov = "^7.1.0"
ruff = "^0.17.3"

[tool.ruff]
line-length = 100
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "UP042"]  # StrEnum changes str() output of the enums

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
